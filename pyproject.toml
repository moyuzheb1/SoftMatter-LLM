[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "softmatter-llm"
version = "0.1.0"
description = "Multimodal LLM system for soft-matter scattering/rheology analysis and phase behavior prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]
train = [
    "torch>=2.1",
    "transformers>=4.44",
    "trl>=0.9",
    "peft>=0.11",
    "datasets>=2.19",
    "accelerate>=0.30",
]
dev = ["pytest>=7"]

[project.scripts]
softmatter = "softmatter.cli:main"

[tool.setuptools.packages.find]
include = ["softmatter*"]
